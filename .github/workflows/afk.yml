
name: Minecraft Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar bot
        run: node bot.js
        env:
          MC_HOST: ${{ vars.MC_HOST }}
          MC_PORT: ${{ vars.MC_PORT }}
          MC_USERNAME: ${{ vars.MC_USERNAME }}
